<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <clipPath id="fc">
      <rect x="1.5" y="1.5" width="29" height="29" rx="3"/>
    </clipPath>
  </defs>

  <!-- Photo frame fills entire canvas -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="3"
        fill="none" stroke="url(#g)" stroke-width="2.5"/>

  <!-- Sun -->
  <circle cx="9" cy="10" r="4" fill="url(#g)"/>

  <!-- Mountain clipped to frame -->
  <g clip-path="url(#fc)">
    <path d="M1.5 30.5 L11 18 L17 22 L23 14 L30.5 23 L30.5 30.5 Z"
          fill="url(#g)"/>
  </g>
</svg>
