/* ===== 左侧图标导航：整体放大1.2倍，颜色加深 ===== */
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:94px;z-index:100;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:18px 0 12px;transition:background .3s;
}
.logo{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:14px;cursor:pointer;flex-shrink:0}
.logo .lg-ic{
  width:52px;height:52px;border-radius:14px;background:#17181c;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:25px;
}
html.light .logo .lg-ic{background:#25272e}
.logo .lg-tx{font-size:15px;font-weight:800;letter-spacing:1px}
.logo .lg-bar{width:24px;height:3px;border-radius:2px;background:var(--accent)}
.side-nav{position:relative;flex:1;width:100%;overflow-y:auto;overflow-x:hidden;padding:4px 0}
.side-nav::-webkit-scrollbar{display:none}
.side-ink{
  position:absolute;left:9px;right:9px;top:0;height:0;z-index:0;
  background:var(--ink);border-radius:14px;
  transition:top .35s cubic-bezier(.45,1.35,.4,1),height .3s ease,
             left .35s cubic-bezier(.45,1.35,.4,1),width .35s cubic-bezier(.45,1.35,.4,1);
}
.side-item{
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  margin:3px 9px;padding:12px 0 11px;border-radius:14px;
  color:var(--side);cursor:pointer;transition:color .2s;user-select:none;
}
.side-item i{font-size:26px;width:30px;text-align:center}
.side-item img{width:28px;height:28px;object-fit:contain}
.side-item span{font-size:15px;white-space:nowrap}
.side-item:hover{color:var(--text)}
.side-item.active{color:var(--text);font-weight:700}

/* ===== 悬停飞出菜单（仅多子分类板块） ===== */
.side-flyout{
  position:fixed;left:104px;z-index:150;min-width:150px;max-width:220px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:7px;box-shadow:0 10px 28px rgba(0,0,0,.3);
  opacity:0;visibility:hidden;transform:translate(-8px,0);
  transition:opacity .18s ease,transform .18s ease,visibility .18s;
}
html.light .side-flyout{box-shadow:0 10px 28px rgba(40,50,90,.14)}
.side-flyout::before{
  content:"";position:absolute;left:-5px;top:25px;
  width:10px;height:10px;background:var(--panel);
  border-left:1px solid var(--border);border-bottom:1px solid var(--border);
  transform:rotate(45deg);
}
.side-flyout.show{opacity:1;visibility:visible;transform:translate(0,0)}
.fly-it{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  font-size:13px;color:var(--text);cursor:pointer;transition:.15s;white-space:nowrap;
}
.fly-it:hover{background:var(--card-h)}
.fly-it.active{font-weight:700}

/* ===== 右上角按钮 ===== */
.top-pill{
  position:fixed;z-index:99;display:inline-flex;align-items:center;gap:7px;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:9px 14px;font-size:13px;font-weight:600;color:var(--sub);transition:.2s;
}
.top-pill:hover{color:var(--text);border-color:#3a4150}
#aboutBtn{right:80px;top:16px}
#themeToggle{right:18px;top:16px;padding:9px 12px}

/* ===== 回到顶部按钮 ===== */
#backTop{
  position:fixed;right:22px;bottom:26px;z-index:99;
  width:44px;height:44px;border-radius:50%;
  background:var(--panel);border:1px solid var(--border);
  color:var(--sub);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.28);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .25s,transform .25s,visibility .25s,color .2s,border-color .2s;
}
html.light #backTop{box-shadow:0 4px 16px rgba(40,50,90,.15)}
#backTop.show{opacity:1;visibility:visible;transform:none}
#backTop:hover{color:var(--pill);border-color:var(--pill);transform:translateY(-2px)}

/* ===== 页面主体 ===== */
.page{margin-left:94px;position:relative;z-index:1}
.content{max-width:1560px;margin:0 auto;padding:22px 26px 60px}

/* ===== 搜索区：缩短1/10，下移留白 ===== */
.search-area{max-width:864px;margin:28px auto 26px;text-align:center}
.search-tabs{
  position:relative;display:flex;justify-content:center;gap:34px;
  margin-bottom:18px;padding-bottom:7px;
}
.search-tabs .ink{
  position:absolute;bottom:0;height:3px;width:0;left:0;z-index:0;
  background:var(--tab-ink);border-radius:2px;
  transition:left .35s cubic-bezier(.45,1.35,.4,1),width .35s cubic-bezier(.45,1.35,.4,1);
}
.s-tab{font-size:15px;color:var(--sub);cursor:pointer;white-space:nowrap;user-select:none;transition:color .2s}
.s-tab:hover{color:var(--text)}
.s-tab.active{color:var(--text);font-weight:700}

/* 搜索框：粗线常显，聚焦再外扩1px（不抖布局）；深色金色/浅色深蓝
   右内距 3px */
.search-bar{
  display:flex;align-items:stretch;height:54px;
  background:var(--input);border:2px solid var(--search-bd);border-radius:12px;
  padding:0 3px 0 22px;transition:box-shadow .15s;cursor:text;
}
.search-bar:focus-within{
  box-shadow:0 0 0 1px var(--search-bd);
}
.search-bar input{
  flex:1;height:100%;border:none;outline:none;background:transparent;
  font-size:15px;color:var(--text);cursor:text;
}
.search-bar input::placeholder{color:var(--sub)}
/* 正方形按钮：同色底；深色金色底配深色图标，浅色蓝底配白图标 */
.search-bar button{
  width:44px;height:44px;border-radius:10px;flex-shrink:0;align-self:center;
  background:var(--search-bd);
  color:#fff;font-size:15px;transition:.2s;
}
html:not(.light) .search-bar button{color:#1c1e24}
.result-bar{display:none;margin-top:14px;font-size:13px;color:var(--sub);text-align:left}
.result-bar.show{display:block}
.result-bar b{color:var(--text)}
.result-bar button{color:var(--accent);font-size:13px}

/* ===== 推广卡：与二次元空间同款深→亮渐变 ===== */
.promo-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.promo{
  color:#fff;border-radius:10px;
  padding:11px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-size:12.5px;font-weight:600;min-height:64px;transition:.2s;text-align:center;
  text-shadow:0 1px 4px rgba(0,0,0,.18);
}
.promo:hover{transform:translateY(-3px);filter:brightness(1.08)}
.promo .pi{font-size:15px}
.promo.c1{background:linear-gradient(100deg,#101b3d,#1c2f75 50%,#3150b8)}
.promo.c2{background:linear-gradient(100deg,#3d1020,#751c3d 50%,#b83258)}
.promo.c3{background:linear-gradient(100deg,#0c2e33,#155a66 50%,#1f8a99)}
.promo.c4{background:linear-gradient(100deg,#0e3320,#1c663d 50%,#2b9e5f)}

/* ===== 双 Banner ===== */
.banner-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.banner{border-radius:12px;padding:16px 24px;display:flex;align-items:center;gap:18px;min-height:88px;transition:.2s;overflow:hidden}
.banner:hover{transform:translateY(-2px)}
.banner.b1{background:linear-gradient(100deg,#161038,#2c2170 50%,#4a2f9e);color:#fff}
.banner.b1 .lg{font-size:20px;font-weight:800;white-space:nowrap;letter-spacing:1px}
.banner.b1 b{font-size:20px;display:block;margin-bottom:4px}
.banner.b1 small{font-size:12px;color:#c9c2ee}
.banner.b1 .btn{margin-left:auto;background:linear-gradient(90deg,#7b4ff0,#a44ff0);padding:9px 16px;border-radius:999px;font-size:12.5px;white-space:nowrap}
.banner.b2{background:#101216;border:1px solid #2a2e35;justify-content:space-between}
html.light .banner.b2{background:#1c2026;border-color:#1c2026;color:#fff}
.banner.b2 .big{font-size:19px;font-weight:800;letter-spacing:3px;margin-bottom:8px;white-space:nowrap}
.banner.b2 .plats{font-size:13px;font-weight:600;white-space:nowrap}
.banner.b2 .rt{color:#ff5a7a;font-size:14px;font-weight:800;letter-spacing:1px;white-space:nowrap;margin-left:auto}

/* ===== 分区面板 ===== */
.panel{
  background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:18px 20px;margin-bottom:16px;
  transition:background .3s;
}
.panel-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.panel-title{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700;white-space:nowrap}
.panel-title i{color:var(--sub);font-size:15px}
.panel-title img{width:16px;height:16px;object-fit:contain}
.sep{width:1px;height:14px;background:var(--border)}

/* 小分类：浅紫胶囊（迷你版），跟随鼠标；浅色模式文字为黑 */
.subtabs{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-width:0;padding:3px 8px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs .ink{
  position:absolute;top:2px;height:calc(100% - 4px);width:0;left:0;z-index:0;
  background:var(--pill-bg);border-radius:999px;
  transition:left .25s cubic-bezier(.3,.7,.4,1),width .25s cubic-bezier(.3,.7,.4,1);
}
.subtab{
  position:relative;z-index:1;font-size:12.5px;color:var(--sub);
  cursor:pointer;white-space:nowrap;user-select:none;
  padding:3px 9px;border-radius:999px;transition:color .2s;
}
.subtab:hover{color:var(--text)}
.subtab.active{color:var(--text);font-weight:700}
.subtab.on-pill{color:var(--pill-tx) !important;font-weight:700}

/* ===== 紧凑卡片 ===== */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(206px,1fr))}
.scard{
  position:relative;display:flex;align-items:center;gap:12px;min-width:0;
  background:var(--card);border-radius:11px;padding:15px 14px;
  transition:.2s;animation:fadeIn .35s both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scard:hover{background:var(--card-h);transform:translateY(-2px)}
/* 网站图标：透明背景融入卡片，内图 28px */
.scard .ic{
  width:42px;height:42px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--text);font-weight:700;font-size:16px;overflow:hidden;
}
.scard .ic img{width:28px;height:28px;object-fit:contain}
.scard:hover .ic{animation:icJump .5s ease}
@keyframes icJump{
  0%{transform:translateY(0)}
  30%{transform:translateY(-7px)}
  55%{transform:translateY(0)}
  75%{transform:translateY(-3px)}
  100%{transform:translateY(0)}
}
.scard .info{flex:1;min-width:0}
.scard .nm{display:block;font-size:13.5px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .ds{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 右侧平台小图标组：绝对定位悬在卡片右上角，
   文字延伸到卡片右内边距处截断；整组缩小至0.8倍贴右上角 */
.pts{
  position:absolute;top:3px;right:7px;z-index:2;
  display:flex;align-items:center;gap:7px;
  transform:scale(.8);transform-origin:right top;
}
.pt{cursor:pointer;user-select:none;transition:transform .15s}
.pt i{
  display:block;font-size:13.5px;line-height:1;
  color:var(--sub);transition:color .2s;
}
/* 详情三角：caret-right 逆时针旋转45° */
.pt i.tri{transform:rotate(-45deg);font-size:25px}
.ptb{ /* APP 文字徽章 */
  display:block;font-size:9px;font-weight:800;line-height:1;
  padding:3px 5px;border-radius:4px;letter-spacing:.5px;
  background:var(--sub);color:var(--bg);transition:background .2s;
}
/* 悬停整张卡片：各图标显示各自颜色 */
.scard:hover .pt i{color:var(--pc,var(--text))}
.scard:hover .ptb{background:var(--pc,var(--text))}
.hotb{
  position:absolute;top:-7px;left:-7px;z-index:2;
  background:var(--accent);color:#fff;font-size:10px;font-weight:800;
  padding:2px 7px;border-radius:999px;
}
.scard.hidden{display:none}

/* ===== 卡片介绍气泡：卡片正下方、箭头朝上，延迟0.8秒显示 ===== */
.glob-tip{
  position:fixed;left:0;top:0;z-index:300;max-width:260px;
  background:#1c1e24;color:#e8eaee;font-size:12px;line-height:1.5;
  padding:7px 11px;border-radius:8px;border:1px solid #3a4150;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  pointer-events:none;opacity:0;visibility:hidden;transform:translateY(3px);
  transition:opacity .12s,transform .12s,visibility .12s;
}
html.light .glob-tip{background:#26282e}
.glob-tip.show{opacity:1;visibility:visible;transform:none}
.glob-tip::after{
  content:"";position:absolute;left:50%;top:-5px;
  width:10px;height:10px;background:#1c1e24;
  border-left:1px solid #3a4150;border-top:1px solid #3a4150;
  transform:translateX(-50%) rotate(45deg);
}
html.light .glob-tip::after{background:#26282e}
.glob-tip.above::after{
  top:auto;bottom:-5px;
  border:none;border-right:1px solid #3a4150;border-bottom:1px solid #3a4150;
}

/* ===== 小图标气泡：图标正上方、箭头朝下，整排等高对齐，立即显示 ===== */
.tip-icon{
  position:fixed;left:0;top:0;z-index:310;white-space:nowrap;
  background:#1c1e24;color:#e8eaee;font-size:12px;line-height:1.5;
  padding:6px 10px;border-radius:7px;border:1px solid #3a4150;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  pointer-events:none;opacity:0;visibility:hidden;transform:translateY(3px);
  transition:opacity .12s,transform .12s,visibility .12s;
}
html.light .tip-icon{background:#26282e}
.tip-icon.show{opacity:1;visibility:visible;transform:none}
.tip-icon::after{
  content:"";position:absolute;left:50%;bottom:-5px;
  width:10px;height:10px;background:#1c1e24;
  border-right:1px solid #3a4150;border-bottom:1px solid #3a4150;
  transform:translateX(-50%) rotate(45deg);
}
html.light .tip-icon::after{background:#26282e}
.tip-icon.below::after{
  bottom:auto;top:-5px;
  border:none;border-left:1px solid #3a4150;border-top:1px solid #3a4150;
}

footer{margin-left:94px;text-align:center;padding:24px;font-size:12.5px;color:var(--sub);position:relative;z-index:1}
footer a:hover{color:var(--pill)}

/* ===== 响应式 ===== */

  .banner{flex-direction:column;align-items:flex-start;gap:10px}
  .banner.b1 .btn{margin-left:0}
  .side-flyout{display:none}
}

window.iconErr=function(img){
  const t=document.createElement("span");
  t.textContent=img.getAttribute("data-letter")||"站";
  img.replaceWith(t);
};
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const iconHTML=(ic,name)=>{
  ic=(ic||"").trim();
  const letter=(name||"站").trim().charAt(0);
  if(!ic) return letter;
  if(ic.startsWith("fa")) return `<i class="${ic}"></i>`;
  return `<img src="${ic}" alt="" loading="lazy" data-letter="${letter}" onerror="iconErr(this)">`;
};
const navIconHTML=(ic)=>{
  ic=(ic||"").trim();
  if(ic.startsWith("fa")) return `<i class="${ic}"></i>`;
  if(ic) return `<img src="${ic}" alt="">`;
  return `<i class="fa-solid fa-cube"></i>`;
};

/* ============ JS 自绘平滑滚动 ============ */
let scrollAnimId=null;
function animScrollTo(targetY){
  const duration=Math.min(900,Math.max(400,Math.abs(targetY-window.scrollY)*0.35));
  if(scrollAnimId)cancelAnimationFrame(scrollAnimId);
  const maxY=document.documentElement.scrollHeight-window.innerHeight;
  targetY=Math.max(0,Math.min(targetY,maxY));
  const startY=window.scrollY,diff=targetY-startY;
  if(Math.abs(diff)<2)return;
  const t0=performance.now();
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  function step(now){
    const p=Math.min((now-t0)/duration,1);
    document.documentElement.scrollTop=startY+diff*ease(p);
    if(p<1)scrollAnimId=requestAnimationFrame(step);
  }
  scrollAnimId=requestAnimationFrame(step);
}
["wheel","touchstart"].forEach(ev=>{
  addEventListener(ev,()=>{if(scrollAnimId)cancelAnimationFrame(scrollAnimId);},{passive:true});
});

const sideItems=[...document.querySelectorAll(".side-item")];
const isMobile=()=>matchMedia("(max-width:900px)").matches;
const topOffset=()=>isMobile()?76:16;

function moveSideInk(){
  const act=sideNav.querySelector(".side-item.active");
  if(!act)return;
  if(isMobile()){
    sideInk.style.top="";sideInk.style.height="";
    slideH(sideInk,act);
  }else{
    sideInk.style.left="";sideInk.style.width="";
    sideInk.style.top=act.offsetTop+"px";
    sideInk.style.height=act.offsetHeight+"px";
  }
}
function showInkAt(el){
  sideItems.forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  moveSideInk();
}
function collapseInk(){
  sideItems.forEach(x=>x.classList.remove("active"));
  if(isMobile()){sideInk.style.width="0";}
  else{sideInk.style.height="0";}
}

/* 飞出菜单 */
const flyout=document.createElement("div");
flyout.className="side-flyout";
document.body.appendChild(flyout);
let hideTimer=null;

function showFlyout(item){
  const sec=DATA.find(s=>"sec-"+s.id===item.dataset.target);
  if(!sec)return;
  const keys=Object.keys(sec.groups);
  if(keys.length<2){flyout.classList.remove("show");return;}
  const cur=sec._cur||keys[0];
  flyout.innerHTML=keys.map(k=>`<span class="fly-it${k===cur?" active":""}" data-sec="${sec.id}" data-key="${k}">${k}</span>`).join("");
  const r=item.getBoundingClientRect();
  const h=flyout.offsetHeight||160;
  let top=r.top-6;
  if(top+h>window.innerHeight-10)top=window.innerHeight-h-10;
  if(top<10)top=10;
  flyout.style.top=top+"px";
  flyout.classList.add("show");
}
function hideFlyout(){
  flyout.classList.remove("show");
  setTimeout(()=>{
    if(!flyout.classList.contains("show")&&!sideNav.matches(":hover"))collapseInk();
  },200);
}

sideItems.forEach(el=>{
  el.addEventListener("mouseenter",()=>{
    if(isMobile())return;
    clearTimeout(hideTimer);
    showInkAt(el);
    showFlyout(el);
  });
  el.addEventListener("mouseleave",()=>{
    clearTimeout(hideTimer);
    hideTimer=setTimeout(hideFlyout,160);
  });
  el.addEventListener("click",()=>{
    showInkAt(el);
    const t=document.getElementById(el.dataset.target);
    if(t)animScrollTo(t.getBoundingClientRect().top+window.scrollY-topOffset());
    if(isMobile()){
      setTimeout(()=>{if(!sideNav.matches(":hover"))collapseInk();},900);
    }
  });
});
sideNav.addEventListener("mouseleave",()=>{
  setTimeout(()=>{
    if(!flyout.classList.contains("show")&&!sideNav.matches(":hover"))collapseInk();
  },200);
});
flyout.addEventListener("mouseenter",()=>clearTimeout(hideTimer));
flyout.addEventListener("mouseleave",()=>{
  clearTimeout(hideTimer);
  hideTimer=setTimeout(hideFlyout,160);
});
flyout.addEventListener("click",e=>{
  const it=e.target.closest(".fly-it");if(!it)return;
  if(it.dataset.key){
    const box=document.querySelector(`.subtabs[data-sec="${it.dataset.sec}"]`);
    if(box){
      const target=[...box.querySelectorAll(".subtab")].find(x=>x.textContent===it.dataset.key);
      if(target)target.click();
    }
    const sec=DATA.find(s=>s.id===it.dataset.sec);
    if(sec)sec._cur=it.dataset.key;
    flyout.querySelectorAll(".fly-it").forEach(x=>x.classList.toggle("active",x===it));
    const t=document.getElementById("sec-"+it.dataset.sec);
    if(t)animScrollTo(t.getBoundingClientRect().top+window.scrollY-topOffset());
    const sideItem=sideItems.find(x=>x.dataset.target==="sec-"+it.dataset.sec);
    if(sideItem)showInkAt(sideItem);
  }
});

document.querySelectorAll(".subtabs").forEach(box=>{
  const ink=box.querySelector(".ink");
  const tabs=()=>[...box.querySelectorAll(".subtab")];
  function pillTo(el){
    if(!el){ink.style.width="0";return;}
    ink.style.left=el.offsetLeft+"px";
    ink.style.width=el.offsetWidth+"px";
    tabs().forEach(x=>x.classList.toggle("on-pill",x===el));
  }
  const init=()=>pillTo(box.querySelector(".subtab.active"));
  init();
  box._init=init;
  tabs().forEach(t=>t.addEventListener("mouseenter",()=>pillTo(t)));
  box.addEventListener("mouseleave",()=>pillTo(box.querySelector(".subtab.active")));
  box.onclick=e=>{
    const t=e.target.closest(".subtab");if(!t)return;
    tabs().forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    pillTo(t);
    const sec=DATA.find(s=>s.id===box.dataset.sec);
    sec._cur=t.textContent;
    document.querySelector("#sec-"+sec.id+" .grid").innerHTML=(sec.groups[t.textContent]||[]).map(card).join("");
  };
});

const tip=document.createElement("div");

const TIP_DELAY=800;
let tipTimer=null;
function tipShow(text,cardEl){
  tip.textContent=text;
  tip.classList.add("show");
  tip.classList.remove("above");
  const r=cardEl.getBoundingClientRect();
  const w=tip.offsetWidth,h=tip.offsetHeight,gap=9;
  let x=r.left+r.width/2-w/2;
  let y=r.bottom+gap;
  if(x<8)x=8;
  if(x+w>innerWidth-8)x=innerWidth-8-w;
  if(y+h>innerHeight-8){y=r.top-h-gap;tip.classList.add("above");}
  tip.style.left=x+"px";tip.style.top=y+"px";
}
function tipHide(){tip.classList.remove("show");}

  tipIc.classList.add("show");
  tipIc.classList.remove("below");
  const r=el.getBoundingClientRect();                       /* 当前图标：水平居中用 */
  const row=el.closest(".pts").getBoundingClientRect();     /* 整排图标：等高锚点 */
  const w=tipIc.offsetWidth,h=tipIc.offsetHeight,gap=9;
  let x=r.left+r.width/2-w/2;
  let y=row.top-h-gap;
  if(x<8)x=8;
  if(x+w>innerWidth-8)x=innerWidth-8-w;
  if(y<8){y=row.bottom+gap;tipIc.classList.add("below");}
  tipIc.style.left=x+"px";tipIc.style.top=y+"px";
}
function tipIcHide(){tipIc.classList.remove("show");}

function allTipCancel(){clearTimeout(tipTimer);tipHide();tipIcHide();}
addEventListener("scroll",allTipCancel,{passive:true});

/* 事件委托：
   小图标→图标气泡立即显示；卡片→0.8秒后显示介绍气泡 */
panelsEl.addEventListener("mouseover",e=>{
  const pt=e.target.closest(".pt");
  if(pt){ /* 指到小图标：立即显示，压掉卡片气泡 */
    clearTimeout(tipTimer);tipHide();
    tipIcShow(pt.dataset.tip,pt);
    return;
  }
  tipIcHide();
  if(e.target.closest(".pts")){clearTimeout(tipTimer);tipHide();return;} /* 图标间隙：都不显示 */
  const cardEl=e.target.closest(".scard");
  if(!cardEl)return;
  clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>tipShow(cardEl.dataset.desc,cardEl),TIP_DELAY);
});
panelsEl.addEventListener("mouseout",e=>{
  const to=e.relatedTarget;
  const pt=e.target.closest(".pt");
  if(pt){
    if(!to||!pt.contains(to))tipIcHide();
    return;
  }
  const cardEl=e.target.closest(".scard");
  if(!cardEl)return;
  if(!to||!cardEl.contains(to)){clearTimeout(tipTimer);tipHide();}
});
panelsEl.addEventListener("click",e=>{
  const pt=e.target.closest(".pt");
  if(!pt)return;
  e.preventDefault();e.stopPropagation();
  allTipCancel();
  window.open(pt.dataset.url,"_blank");
});

/* ============ 顶部搜索 ============ */
const tabsBox=document.getElementById("searchTabs"),kw=document.getElementById("kw"),
      goBtn=document.getElementById("go"),resultBar=document.getElementById("resultBar"),
      searchBar=document.getElementById("searchBar");
let curTab=0;

tabsBox.insertAdjacentHTML("beforeend",
  TABS.map((x,i)=>`<span class="s-tab${i?"":" active"}" data-i="${i}">${x.t}</span>`).join(""));

/* 点击搜索框任意位置（含边缘/留白）都聚焦输入框；点按钮除外 */
searchBar.addEventListener("click",e=>{
  if(e.target.closest("#go"))return;
  kw.focus();
});

tabsBox.onclick=e=>{
  const t=e.target.closest(".s-tab");if(!t)return;
  tabsBox.querySelectorAll(".s-tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  slideH(tabsBox.querySelector(".ink"),t);
  curTab=+t.dataset.i;
  kw.placeholder=TABS[curTab].t;
  kw.focus();
  if(curTab===0){clearFilter();resultBar.classList.remove("show");}
};
function siteFilter(k){
  let total=0;
  document.querySelectorAll(".panel").forEach(p=>{
    let vis=0;
    p.querySelectorAll(".scard").forEach(c=>{
      const hit=(c.dataset.kw||"").includes(k);
      c.classList.toggle("hidden",!hit);if(hit)vis++;
    });
    p.style.display=vis?"":"none";total+=vis;
  });
  resultBar.innerHTML=`共找到 <b>${total}</b> 个与「${k}」相关的站点 &nbsp;<button onclick="clearFilter()">清除筛选</button>`;
  resultBar.classList.add("show");
}
function clearFilter(){
  document.querySelectorAll(".scard.hidden").forEach(c=>c.classList.remove("hidden"));
  document.querySelectorAll(".panel").forEach(p=>p.style.display="");
  resultBar.classList.remove("show");
}
goBtn.onclick=()=>{
  const k=kw.value.trim();if(!k){kw.focus();return;}
  if(curTab===0){siteFilter(k.toLowerCase());}
  else{window.open(TABS[curTab].u.split("{kw}").join(encodeURIComponent(k)),"_blank");}
};
kw.addEventListener("keydown",e=>{if(e.key==="Enter")goBtn.click()});

/* ============ 回到顶部按钮 ============ */
const backTop=document.getElementById("backTop");
function checkBackTop(){
  backTop.classList.toggle("show",window.scrollY>300);
}
addEventListener("scroll",checkBackTop,{passive:true});
backTop.addEventListener("click",()=>animScrollTo(0));

/* ============ 主题切换（默认深色） ============ */
const htmlEl=document.documentElement,tbtn=document.getElementById("themeToggle");
function setTheme(light){
  htmlEl.classList.toggle("light",light);
  tbtn.innerHTML=`<i class="fa-solid fa-${light?"moon":"sun"}"></i>`;
  try{localStorage.setItem("acg-theme",light?"light":"dark");}catch(err){}
}
tbtn.onclick=()=>setTheme(!htmlEl.classList.contains("light"));
try{if(localStorage.getItem("acg-theme")==="light")setTheme(true);}catch(err){}

/* ============ 初始化 ============ */
function initInks(){
  const act=sideNav.querySelector(".side-item.active");
  if(act&&!sideNav.matches(":hover")){sideInk.style.height="0";sideInk.style.width="0";}
  document.querySelectorAll(".subtabs").forEach(b=>b._init());
  slideH(tabsBox.querySelector(".ink"),tabsBox.querySelector(".s-tab.active"));
}
initInks();
checkBackTop();
setTimeout(initInks,80);
addEventListener("load",()=>setTimeout(initInks,120));
addEventListener("resize",()=>{initInks();hideFlyout();});
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>initInks());}
</script>
