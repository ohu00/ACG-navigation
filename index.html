<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACG百科|导航 · 二次元汇聚地</title>
    <!-- 添加 favicon -->
    <link rel="icon" href="./favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- 其他样式... -->
</head>
    
    <style>
        /* ================================================================
           【可调】CSS 变量（亮色/暗色主题）
           搜索 "【可调" 快速定位所有可调整项
           每个变量后均附有详细说明
           ================================================================ */
        :root {
            /* -------- 背景颜色（亮色） -------- */
            --bg-body: #ffffff; /* 【可调】页面整体背景色（亮色） */
            --bg-container: rgba(255, 255, 255, 0.35); /* 【可调】分类卡片背景色 + 透明度（0.92=92%不透明，可调0~1） */
            --bg-card: rgba(252, 249, 246, 0.8); /* 【可调】站点卡片背景色 + 透明度 */
            --bg-sidebar: rgba(255, 253, 251, 0.65); /* 【可调】侧栏背景色 + 透明度 */
            --bg-sidebar-hover: #f5576c; /* 【可调】侧栏悬停背景色 */
            --bg-search: #ffffff; /* 【可调】搜索框背景色 */
            --bg-badge: #2d2a24; /* 【可调】"今日热推" 徽标背景色 */

            /* -------- 文字颜色（亮色） -------- */
            --text-primary: #2d2a24; /* 【可调】主标题/正文颜色 */
            --text-secondary: #8a7a6a; /* 【可调】次要文字/描述颜色 */
            --text-muted: #b0a292; /* 【可调】灰色/辅助文字颜色 */
            --text-footer: rgba(255, 255, 255, 0.75); /* 【可调】页脚文字颜色 + 透明度 */

            /* -------- 边框 & 阴影 -------- */
            --border-color: rgba(232, 221, 208, 0.6); /* 【可调】边框颜色 + 透明度 */
            --border-hover: rgba(224, 212, 200, 0.8); /* 【可调】悬停边框颜色 + 透明度 */
            --shadow-color: rgba(0, 0, 0, 0.06); /* 【可调】阴影颜色 + 透明度（数值越大阴影越深） */

            /* -------- 图标 & 标签 -------- */
            --icon-bg: rgba(240, 232, 224, 0.7); /* 【可调】图标背景色 + 透明度 */

            /* -------- 暗色模式遮罩（背景图变暗） -------- */
            --bg-overlay: rgba(0, 0, 0, 0.1); /* 【可调】亮色模式下背景图遮罩（0 = 无遮罩） */
        }

        /* ================================================================
           暗色模式（覆盖上述变量）
           ================================================================ */
        body.dark-mode {
            /* -------- 背景颜色（暗色） -------- */
            --bg-body: #1a1a1e;
            --bg-container: rgba(30, 30, 35, 0.35);
            --bg-card: rgba(40, 40, 46, 0.8);
            --bg-sidebar: rgba(30, 30, 35, 0.92);
            --bg-sidebar-hover: #f5576c;
            --bg-search: #2a2a30;
            --bg-badge: #f0e8e0;

            --text-primary: #e8e4e0;
            --text-secondary: #bfb6ae;
            --text-muted: #8f857a;
            --text-footer: rgba(255, 255, 255, 0.75);

            --border-color: rgba(60, 56, 52, 0.6);
            --border-hover: rgba(100, 90, 80, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.3);

            --icon-bg: rgba(60, 56, 52, 0.6);

            --bg-overlay: rgba(0, 0, 0, 0.5);
        }

        /* ================================================================
           全局重置 & 基础样式
           ================================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background-image: url('./background.jpg'); /* 【可调】背景图片路径（替换文件名即可） */
            background-size: cover; /* 【可调】背景尺寸：cover(铺满) / contain(完整) / 100% 100% */
            background-position: center; /* 【可调】背景位置：center / top / bottom / left / right */
            background-attachment: fixed; /* 【可调】背景固定：fixed(固定) / scroll(滚动) */
            background-repeat: no-repeat; /* 【可调】背景重复：no-repeat / repeat / repeat-x / repeat-y */
            position: relative;
            color: var(--text-primary);
            padding: 2rem 1.5rem; /* 【可调】页面内边距（上下 2rem，左右 1.5rem） */
            line-height: 1.6; /* 【可调】行高 */
            min-height: 100vh; /* 【可调】最小高度 */
            transition: background-color 0.3s, color 0.3s; /* 【可调】颜色过渡时间 */
        }

        /* -------- 背景图遮罩层（用于暗色模式变暗） -------- */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-overlay); /* 透明度由 --bg-overlay 控制 */
            pointer-events: none;
            z-index: 0;
            transition: background-color 0.3s; /* 【可调】遮罩过渡时间 */
        }

        .container {
            max-width: 1440px; /* 【可调】页面最大宽度 */
            margin: 0 auto;
            padding: 0 20px; /* 左右对称内边距，内容居中 */
            position: relative;
            z-index: 1;
        }

        /* ================================================================
           侧栏导航（左侧固定）
           ================================================================ */
        #sidebar {
            position: fixed;
            left: 12px; /* 【可调】侧栏距离左侧距离 */
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px; /* 【可调】侧栏导航项之间的间距 */
            background: var(--bg-sidebar);
            backdrop-filter: blur(0.5px); /* 【可调】侧栏毛玻璃模糊度（px 越大越模糊） */
            padding: 12px 8px; /* 【可调】侧栏内边距（上下 12px，左右 8px） */
            border-radius: 20px; /* 【可调】侧栏圆角 */
            box-shadow: 0 4px 20px var(--shadow-color); /* 【可调】侧栏阴影（水平 垂直 模糊 颜色） */
            border: 1px solid var(--border-color); /* 【可调】侧栏边框粗细 + 颜色 */
            max-height: 80vh; /* 【可调】侧栏最大高度（80%视口高度） */
            overflow-y: auto; /* 【可调】溢出滚动：auto / hidden / scroll */
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s; /* 【可调】过渡时间 */
        }

        #sidebar a {
            display: block;
            padding: 4px 10px; /* 【可调】导航项内边距 */
            font-size: 0.9rem; /* 【可调】导航项字号 */
            font-weight: 500; /* 【可调】导航项字重 */
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 30px; /* 【可调】导航项圆角 */
            transition: background 0.2s, color 0.2s; /* 【可调】悬停过渡时间 */
            white-space: nowrap;
            text-align: center;
            letter-spacing: 0.3px; /* 【可调】字间距 */
            cursor: pointer;
        }
        #sidebar a:hover {
            background: var(--bg-sidebar-hover);
            color: #fff;
        }

        /* 侧栏滚动条 */
        #sidebar::-webkit-scrollbar {
            width: 3px; /* 【可调】滚动条宽度 */
        }
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px; /* 【可调】滚动条圆角 */
        }

        /* ================================================================
           头部（Logo + 搜索 + 暗色切换）
           ================================================================ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem; /* 【可调】头部各元素间距 */
            margin-bottom: 2.5rem; /* 【可调】头部底部外边距 */
            padding-bottom: 1.5rem; /* 【可调】头部底部内边距（与边框距离） */
            border-bottom: 2px solid var(--border-color); /* 【可调】头部下边框粗细 + 颜色 */
            transition: border-color 0.3s; /* 【可调】边框颜色过渡时间 */
        }

        .logo { display: flex; align-items: center; gap: 8rem; } /* 【可调】Logo 图片与标语间距 */
        .logo a { display: inline-block; line-height: 0; }
        .logo img {
            height: 128px; /* 【可调】Logo 图片高度（宽度自动等比） */
            width: auto;
            vertical-align: middle;
            transition: opacity 0.2s; /* 【可调】悬停过渡时间 */
        }
        .logo img:hover { opacity: 0.8; } /* 【可调】Logo 悬停透明度 */
        .logo .slogan {
            font-size: 1.95rem; /* 【可调】标语字号 */
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 0.25rem; /* 【可调】标语左间距 */
            transition: color 0.3s; /* 【可调】颜色过渡时间 */
        }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 1.2rem; /* 【可调】头部右侧各元素间距 */
            flex-wrap: wrap;
        }

        /* -------- "今日热推" 徽标 -------- */
        .header-meta .badge {
            background: var(--bg-badge);
            color: var(--bg-body);
            padding: 0.3rem 1rem; /* 【可调】徽标内边距 */
            border-radius: 20px; /* 【可调】徽标圆角 */
            font-size: 0.8rem; /* 【可调】徽标字号 */
            font-weight: 500;
            letter-spacing: 0.3px; /* 【可调】徽标字间距 */
            transition: background 0.3s, color 0.3s; /* 【可调】过渡时间 */
        }
        .header-meta .badge i { margin-right: 6px; } /* 【可调】徽标图标右间距 */

        /* -------- 搜索框 -------- */
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-search);
            border: 1px solid var(--border-color); /* 【可调】搜索框边框粗细 + 颜色 */
            border-radius: 30px; /* 【可调】搜索框圆角 */
            padding: 0.3rem 0.3rem 0.3rem 1.2rem; /* 【可调】搜索框内边距（左 1.2rem，右 0.3rem） */
            transition: 0.25s, border-color 0.3s, background 0.3s; /* 【可调】过渡时间 */
        }
        .search-box:focus-within {
            border-color: #f5576c; /* 【可调】搜索框聚焦时边框颜色 */
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.15); /* 【可调】聚焦时外发光（大小 + 颜色 + 透明度） */
        }
        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.9rem; /* 【可调】搜索框输入字号 */
            padding: 0.4rem 0; /* 【可调】搜索框输入上下内边距 */
            width: 160px; /* 【可调】搜索框输入宽度 */
            color: var(--text-primary);
            transition: color 0.3s; /* 【可调】颜色过渡时间 */
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box button {
            background: #f5576c; /* 【可调】搜索按钮背景色 */
            border: none;
            color: #fff;
            padding: 0.4rem 1.2rem; /* 【可调】搜索按钮内边距 */
            border-radius: 30px; /* 【可调】搜索按钮圆角 */
            font-size: 0.85rem; /* 【可调】搜索按钮字号 */
            cursor: pointer;
            transition: 0.2s; /* 【可调】按钮过渡时间 */
            font-weight: 500;
        }
        .search-box button:hover { background: #d94356; } /* 【可调】搜索按钮悬停背景色 */

        /* -------- 暗色模式切换按钮 -------- */
        .theme-toggle {
            background: var(--bg-search);
            border: 1px solid var(--border-color); /* 【可调】切换按钮边框粗细 + 颜色 */
            border-radius: 30px; /* 【可调】切换按钮圆角 */
            padding: 0.3rem 0.8rem; /* 【可调】切换按钮内边距 */
            font-size: 1.1rem; /* 【可调】切换按钮图标大小 */
            cursor: pointer;
            color: var(--text-primary);
            transition: 0.3s; /* 【可调】过渡时间 */
            display: flex;
            align-items: center;
            gap: 0.3rem; /* 【可调】图标与文字间距 */
            line-height: 1.4;
        }
        .theme-toggle:hover {
            border-color: #f5576c;
            background: var(--bg-sidebar-hover);
            color: #fff;
        }
        .theme-toggle .toggle-label {
            font-size: 0.75rem; /* 【可调】切换按钮文字大小 */
            font-weight: 500;
        }

        /* ================================================================
           分类卡片
           ================================================================ */
        .category-grid { display: flex; flex-direction: column; gap: 2.5rem; } /* 【可调】分类卡片之间的间距 */

        .category-card {
            background: var(--bg-container);
            backdrop-filter: blur(2px); /* 【可调】分类卡片毛玻璃模糊度 */
            border-radius: 24px; /* 【可调】分类卡片圆角 */
            padding: 1.8rem 2rem 2rem; /* 【可调】分类卡片内边距（上 1.8rem，左右 2rem，下 2rem） */
            box-shadow: 0 4px 20px var(--shadow-color); /* 【可调】分类卡片阴影 */
            border: 1px solid var(--border-color); /* 【可调】分类卡片边框粗细 + 颜色 */
            transition: 0.3s; /* 【可调】分类卡片过渡时间 */
            scroll-margin-top: 20px; /* 【可调】滚动定位时距顶部的偏移量 */
        }
        .category-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 8px 32px var(--shadow-color); /* 【可调】悬停时阴影（更大） */
        }

        /* -------- 分类标题 -------- */
        .category-title {
            display: flex;
            align-items: center;
            gap: 0.6rem; /* 【可调】标题图标与文字间距 */
            font-size: 1.5rem; /* 【可调】分类标题字号 */
            font-weight: 600;
            margin-bottom: 1.5rem; /* 【可调】标题底部外边距 */
            padding-bottom: 0.6rem; /* 【可调】标题底部内边距（与边框距离） */
            border-bottom: 2px dashed var(--border-color); /* 【可调】标题下边框粗细 + 样式（dashed/dotted/solid） */
            transition: border-color 0.3s; /* 【可调】过渡时间 */
            color: var(--text-primary);
        }
        .category-title i {
            color: #f5576c; /* 【可调】标题图标颜色 */
            font-size: 1.4rem; /* 【可调】标题图标大小 */
            width: 2rem; /* 【可调】标题图标宽度（保证对齐） */
            text-align: center;
        }
        .category-title .count {
            font-size: 0.8rem; /* 【可调】站点数量字号 */
            font-weight: 400;
            color: var(--text-muted);
            margin-left: auto;
            background: var(--icon-bg);
            padding: 0.1rem 0.9rem; /* 【可调】数量标签内边距 */
            border-radius: 30px; /* 【可调】数量标签圆角 */
            transition: background 0.3s, color 0.3s; /* 【可调】过渡时间 */
        }

        /* ================================================================
           站点卡片（左图标 + 右上名称 + 右下描述）
           ================================================================ */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); /* 【可调】每列最小宽度（210px），自动填充 */
            gap: 1.1rem; /* 【可调】站点卡片之间的间距 */
        }

        .item-card {
            background: var(--bg-card);
            border-radius: 16px; /* 【可调】站点卡片圆角 */
            padding: 0.8rem 0.9rem 0.7rem; /* 【可调】站点卡片内边距（上 0.8rem，左右 0.9rem，下 0.7rem） */
            transition: 0.2s ease; /* 【可调】过渡时间 */
            border: 1px solid transparent; /* 【可调】默认边框（透明） */
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .item-card:hover {
            background: var(--bg-container);
            border-color: var(--border-hover);
            transform: translateY(-2px); /* 【可调】悬停上浮距离 */
            box-shadow: 0 8px 24px var(--shadow-color); /* 【可调】悬停阴影 */
        }

        /* -------- 卡片头部（图标 + 文字信息） -------- */
        .item-card .item-header {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem; /* 【可调】图标与文字间距 */
            pointer-events: none;
        }

        /* -------- 图标 -------- */
        .item-card .item-icon {
            width: 42px; /* 【可调】图标容器宽度 */
            height: 42px; /* 【可调】图标容器高度（与宽度一致保持正方形） */
            border-radius: 8px; /* 【可调】图标圆角 */
            background: var(--icon-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem; /* 【可调】图标内文字（占位符）字号 */
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
            overflow: hidden;
            transition: background 0.3s, color 0.3s; /* 【可调】过渡时间 */
            margin-top: 2px; /* 【可调】图标顶部微调（与文字对齐） */
        }
        .item-card .item-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 【可调】图标填充方式：contain(完整) / cover(裁剪) / fill(拉伸) */
        }
        .item-card .item-icon .fallback {
            font-size: 18px; /* 【可调】占位文字大小 */
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* -------- 右侧信息（名称 + 描述） -------- */
        .item-card .item-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        /* -------- 站点名称 -------- */
        .item-card .item-title {
            font-weight: 600;
            font-size: 0.95rem; /* 【可调】站点名称字号 */
            color: var(--text-primary);
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s; /* 【可调】颜色过渡时间 */
            line-height: 1.3; /* 【可调】行高 */
        }
        .item-card .item-title a {
            color: inherit;
            text-decoration: none;
            transition: 0.15s; /* 【可调】链接过渡时间 */
            pointer-events: auto;
        }
        .item-card .item-title a:hover { color: #f5576c; } /* 【可调】链接悬停颜色 */

        /* -------- 站点描述 -------- */
        .item-card .item-desc {
            font-size: 0.72rem; /* 【可调】描述字号 */
            color: var(--text-secondary);
            line-height: 1.3; /* 【可调】描述行高 */
            display: -webkit-box;
            -webkit-line-clamp: 2; /* 【可调】描述最大显示行数（2行，超出省略号） */
            -webkit-box-orient: vertical;
            overflow: hidden;
            pointer-events: none;
            transition: color 0.3s; /* 【可调】颜色过渡时间 */
            margin-top: 0.05rem; /* 【可调】描述与名称的间距 */
        }

        /* ================================================================
           页脚
           ================================================================ */
        .footer {
            margin-top: 3.5rem; /* 【可调】页脚顶部外边距 */
            padding-top: 1.8rem; /* 【可调】页脚顶部内边距（与边框距离） */
            border-top: 1px solid var(--border-color); /* 【可调】页脚上边框粗细 + 颜色 */
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem; /* 【可调】页脚各元素间距 */
            font-size: 0.85rem; /* 【可调】页脚字号 */
            align-items: flex-end; /* 让子元素在垂直方向靠下对齐 */
            color: var(--text-footer);
            transition: border-color 0.3s, color 0.3s; /* 【可调】过渡时间 */
        }
        .footer a {
            color: var(--text-footer);
            text-decoration: none;

        // ================================================================
        //  渲染引擎（含平滑滚动）
        //  以下函数用于生成页面内容、侧栏导航，并实现滚动跟随
        // ================================================================
        const grid = document.getElementById('categoryGrid');
        const sidebar = document.getElementById('sidebar');
        let navLinks = [];
        let categoryCards = [];
        let scrollTimer = null;
        let isScrolling = false;
        let activeIndex = 0;
        let followTimer = null;

        /**
         * 自定义平滑滚动函数
         * @param {Element} targetElement - 目标元素
         * @param {Window|Element} container - 滚动容器（window 或侧栏）
         * @param {number} offset - 滚动偏移量（像素）
         * @param {number} duration - 动画持续时间（毫秒）
         */
        function smoothScrollTo(targetElement, container = window, offset = 0, duration = 600) {
            return new Promise((resolve) => {
                const start = container === window ? window.pageYOffset : container.scrollTop;
                const rect = targetElement.getBoundingClientRect();
                const target = start + rect.top - offset;
                const startTime = performance.now();
                function step(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    // easeInOutQuad 缓动函数
                    const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                    const newPos = start + (target - start) * ease;
                    if (container === window) { window.scrollTo(0, newPos); } else { container.scrollTop = newPos; }
                    if (progress < 1) { requestAnimationFrame(step); } else { resolve(); }
                }
                requestAnimationFrame(step);
            });
        }

        /**
         * 侧栏滚动到指定导航项（居中）
         */
        function scrollSidebarToLink(linkElement, duration = 400) {
            const container = sidebar;
            const linkRect = linkElement.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const offset = linkRect.top - containerRect.top - container.clientHeight / 2 + linkRect.height / 2;
            const targetScroll = container.scrollTop + offset;
            const start = container.scrollTop;
            const startTime = performance.now();
            return new Promise((resolve) => {
                function step(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                    container.scrollTop = start + (targetScroll - start) * ease;
                    if (progress < 1) { requestAnimationFrame(step); } else { resolve(); }
                }
                requestAnimationFrame(step);
            });
        }

        /**
         * 渲染主函数：根据数据生成分类卡片和侧栏导航
         */
        function render(data) {
            grid.innerHTML = '';
            sidebar.innerHTML = '';
            navLinks = [];
            categoryCards = [];

            data.forEach((cat, index) => {
                // ---- 分类卡片 ----
                const card = document.createElement('div');
                card.className = 'category-card';
                card.id = `category-${index}`;

                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                const iconMatch = cat.category.match(/^(.+?)\s/);
                const iconHtml = iconMatch ? iconMatch[1] : '📌';
                const name = cat.category.replace(/^.+?\s/, '');
                titleDiv.innerHTML = `
                    <span>${iconHtml}</span>
                    ${name}
                    <span class="count">${cat.items.length} 个站点</span>
                `;
                card.appendChild(titleDiv);

                const itemsGrid = document.createElement('div');
                itemsGrid.className = 'items-grid';
                cat.items.forEach(item => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'item-card';
                    cardEl.dataset.link = item.link;

                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'item-header';

                    // 图标
                    const iconContainer = document.createElement('div');
                    iconContainer.className = 'item-icon';
                    const img = document.createElement('img');
                    img.src = item.icon;
                    img.alt = item.title;
                    img.onerror = function() {
                        this.style.display = 'none';
                        const fallback = document.createElement('span');
                        fallback.className = 'fallback';
                        fallback.textContent = item.title.charAt(0).toUpperCase();
                        iconContainer.appendChild(fallback);
                    };
                    iconContainer.appendChild(img);
                    headerDiv.appendChild(iconContainer);

                    // 信息区（名称 + 描述）
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'item-info';

                    const titleLink = document.createElement('div');
                    titleLink.className = 'item-title';
                    const a = document.createElement('a');
                    a.href = item.link;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.textContent = item.title;
                    titleLink.appendChild(a);
                    infoDiv.appendChild(titleLink);

                    const descDiv = document.createElement('div');
                    descDiv.className = 'item-desc';
                    descDiv.textContent = item.desc || '';
                    infoDiv.appendChild(descDiv);

                    headerDiv.appendChild(infoDiv);
                    cardEl.appendChild(headerDiv);

                    // 点击卡片（整卡可点，排除内部链接）
                    cardEl.addEventListener('click', function(e) {
                        if (e.target.closest('a')) return;
                        const link = this.dataset.link;
                        if (link) window.open(link, '_blank');
                    });

                    itemsGrid.appendChild(cardEl);
                });

                card.appendChild(itemsGrid);
                grid.appendChild(card);
                categoryCards.push(card);

                // ---- 侧栏导航链接 ----
                const navLink = document.createElement('a');
                navLink.href = `#category-${index}`;
                navLink.textContent = name;
                navLink.dataset.index = index;

                navLink.addEventListener('click', async function(e) {
                    e.preventDefault();
                    if (isScrolling) return;
                    isScrolling = true;
                    const idx = parseInt(this.dataset.index);
                    const target = document.getElementById(`category-${idx}`);
                    if (target) {
                        await smoothScrollTo(target, window, 20, 600); // 页面滚动
                        await scrollSidebarToLink(this, 400);          // 侧栏滚动
                    }
                    isScrolling = false;
                });

                sidebar.appendChild(navLink);
                navLinks.push(navLink);
            });

            // 启动侧栏跟随滚动
            setupSidebarFollow();
        }

        // ================================================================
        //  侧栏跟随滚动（页面滚动时自动将对应链接滚到侧栏中央）
        // ================================================================
        function setupSidebarFollow() {
            window.removeEventListener('scroll', handleScroll);
            window.addEventListener('scroll', handleScroll, { passive: true });
            handleScroll();
        }

        function handleScroll() {
            if (followTimer) return;
            followTimer = requestAnimationFrame(() => {
                const cards = categoryCards;
                if (!cards.length) { followTimer = null; return; }
                let newIndex = 0;
                let found = false;
                for (let i = 0; i < cards.length; i++) {
                    const rect = cards[i].getBoundingClientRect();
                    if (rect.top < 20) continue;
                    newIndex = i;
                    found = true;
                    break;
                }
                if (!found && cards.length > 0) newIndex = cards.length - 1;
                if (newIndex !== activeIndex) {
                    activeIndex = newIndex;
                    const link = navLinks[activeIndex];
                    if (link) scrollSidebarToLink(link, 300);
                }
                followTimer = null;
            });
        }

        // ================================================================
        //  搜索功能（实时过滤站点）
        // ================================================================
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        function doSearch() {
            const keyword = searchInput.value.trim().toLowerCase();
            if (!keyword) { render(navData); return; }
            const filtered = navData
                .map(cat => {
                    const matchedItems = cat.items.filter(item =>
                        item.title.toLowerCase().includes(keyword) ||
                        (item.desc && item.desc.toLowerCase().includes(keyword)) ||
                        (item.tags && item.tags.some(t => t.toLowerCase().includes(keyword)))
                    );
                    if (matchedItems.length === 0) return null;
                    return { ...cat, items: matchedItems };
                })
                .filter(Boolean);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="no-result">
                        <i class="fas fa-search"></i>
                        没有找到「${keyword}」相关站点，试试其他关键词～
                    </div>
                `;
                sidebar.innerHTML = '';
                navLinks = [];
                categoryCards = [];
                window.removeEventListener('scroll', handleScroll);
            } else {
                render(filtered);
            }
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        // ================================================================
        //  暗色模式切换（偏好自动保存到 localStorage）
        // ================================================================
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeLabel = document.getElementById('themeLabel');

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            updateToggleUI(true);
        }

        function updateToggleUI(isDark) {
            if (isDark) {
                themeIcon.className = 'fas fa-sun';
                themeLabel.textContent = '亮色';
            } else {
                themeIcon.className = 'fas fa-moon';
                themeLabel.textContent = '暗色';
            }
        }

        themeToggle.addEventListener('click', function() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateToggleUI(isDark);
        });

        // ================================================================
        //  启动程序
        // ================================================================
        render(navData);
    </script>
